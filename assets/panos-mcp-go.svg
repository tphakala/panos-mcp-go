<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Brand Gradients -->
    <linearGradient id="panGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59" />
      <stop offset="100%" stop-color="#FA582D" />
    </linearGradient>

    <linearGradient id="goGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#00ADD8" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" opacity="0.6" />
      <circle cx="30" cy="0" r="1" fill="#334155" opacity="0.5" />
    </pattern>

    <!-- Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Canvas -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2" />
  <rect width="1200" height="380" rx="16" fill="url(#grid)" />

  <!-- Ambient Accent Orbs -->
  <circle cx="210" cy="190" r="140" fill="#FA582D" opacity="0.07" filter="url(#glow)" />
  <circle cx="270" cy="190" r="140" fill="#00ADD8" opacity="0.08" filter="url(#glow)" />

  <!-- ==================== LEFT LOGO MARK ==================== -->
  <g transform="translate(40, 20)">
    <!-- Outer Shield Boundary -->
    <path d="M 200 65 L 290 100 C 290 200, 245 275, 200 310 C 155 275, 110 200, 110 100 Z" 
          fill="#0B1120" stroke="#1E293B" stroke-width="8" stroke-linejoin="round" />

    <!-- Left Shield (PAN-OS Orange) -->
    <path d="M 200 78 L 122 108 C 122 192, 160 258, 200 292 Z" 
          fill="url(#panGrad)" opacity="0.18" />
    <path d="M 200 78 L 122 108 C 122 192, 160 258, 200 292" 
          fill="none" stroke="url(#panGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Shield (Go Cyan) -->
    <path d="M 200 78 L 278 108 C 278 192, 240 258, 200 292 Z" 
          fill="url(#goGrad)" opacity="0.18" />
    <path d="M 200 78 L 278 108 C 278 192, 240 258, 200 292" 
          fill="none" stroke="url(#goGrad)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />

    <!-- MCP Constellation & Bridge Network -->
    <g filter="url(#glow)">
      <line x1="200" y1="130" x2="155" y2="180" stroke="#FA582D" stroke-width="5" stroke-linecap="round" />
      <line x1="200" y1="130" x2="245" y2="180" stroke="#00ADD8" stroke-width="5" stroke-linecap="round" />
      <line x1="155" y1="180" x2="200" y2="230" stroke="#FA582D" stroke-width="5" stroke-linecap="round" />
      <line x1="245" y1="180" x2="200" y2="230" stroke="#00ADD8" stroke-width="5" stroke-linecap="round" />
      <line x1="200" y1="130" x2="200" y2="230" stroke="#F8FAFC" stroke-width="4" stroke-dasharray="6 6" />

      <!-- Node Circles -->
      <circle cx="200" cy="130" r="11" fill="#F8FAFC" stroke="#00ADD8" stroke-width="4" />
      <circle cx="155" cy="180" r="9" fill="#FA582D" stroke="#0B1120" stroke-width="3" />
      <circle cx="245" cy="180" r="9" fill="#00ADD8" stroke="#0B1120" stroke-width="3" />
      <circle cx="200" cy="230" r="13" fill="#020617" stroke="#38BDF8" stroke-width="4" />
      <circle cx="200" cy="230" r="5" fill="#FA582D" />
    </g>
  </g>

  <!-- ==================== VERTICAL DIVIDER ==================== -->
  <line x1="395" y1="70" x2="395" y2="310" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- ==================== RIGHT TEXT CONTENT ==================== -->
  <g transform="translate(435, 0)">
    <!-- Overline Category -->
    <g transform="translate(0, 85)">
      <rect width="186" height="26" rx="6" fill="#1E293B" opacity="0.8" />
      <circle cx="14" cy="13" r="4" fill="#FA582D" />
      <text x="26" y="17" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="11" font-weight="700" fill="#94A3B8" letter-spacing="1.5">MCP TOOL SERVER</text>
    </g>

    <!-- Main Project Name -->
    <text x="0" y="160" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="54" font-weight="800" letter-spacing="-1">
      <tspan fill="#F8FAFC">panos</tspan><tspan fill="#FA582D">-mcp</tspan><tspan fill="#00ADD8">-go</tspan>
    </text>

    <!-- Subtitle / Mission Statement -->
    <text x="0" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" fill="#CBD5E1" letter-spacing="-0.2">
      Model Context Protocol server for Palo Alto Networks firewalls &amp; Panorama
    </text>

    <!-- Secondary Line -->
    <text x="0" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400" fill="#64748B">
      Built with Go &amp; the official <tspan fill="#94A3B8" font-family="'JetBrains Mono', monospace">pango</tspan> SDK for secure LLM automation and policy querying.
    </text>

    <!-- Architecture & Capability Badges -->
    <g transform="translate(0, 268)">
      <!-- Badge 1: Go Native -->
      <g>
        <rect width="90" height="28" rx="6" fill="#082F49" stroke="#0284C7" stroke-width="1" />
        <text x="45" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="middle">Go Native</text>
      </g>

      <!-- Badge 2: PAN-OS & Panorama -->
      <g transform="translate(100, 0)">
        <rect width="144" height="28" rx="6" fill="#431407" stroke="#EA580C" stroke-width="1" />
        <text x="72" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FB923C" text-anchor="middle">PAN-OS &amp; Panorama</text>
      </g>

      <!-- Badge 3: pango SDK -->
      <g transform="translate(254, 0)">
        <rect width="96" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="48" y="18" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">pango SDK</text>
      </g>

      <!-- Badge 4: StdIO & SSE -->
      <g transform="translate(360, 0)">
        <rect width="112" height="28" rx="6" fill="#0F172A" stroke="#334155" stroke-width="1" />
        <text x="56" y="18" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#94A3B8" text-anchor="middle">stdio / sse ready</text>
      </g>
    </g>
  </g>
</svg>
