version: 2
project_name: panos-mcp-go
builds:
  - main: .
    binary: panos-mcp-go
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # main.version is the only stamped symbol (see main.go); keep -s -w for smaller
    # binaries, matching what the previous hand-rolled release job produced.
    ldflags:
      - -s -w -X main.version={{ .Version }}
archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
checksum:
  name_template: checksums.txt
changelog:
  use: github
  filters:
    exclude:
      - '^ci:'
      - '^docs?:'
      - '^README'
