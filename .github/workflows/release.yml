name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 so the tag is present; persist-credentials: false keeps the
      # GITHUB_TOKEN out of .git/config. Asset upload below uses the token from the
      # job environment, not the checkout credential, so dropping it is safe.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      # Cross-compile static binaries. CGO is off so the linux binaries are fully
      # static and every target builds without a C toolchain. main.version is
      # stamped from the tag via -X main.version, the same key task go:build
      # uses; release additionally passes -s -w -trimpath for smaller binaries.
      - name: Build binaries
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          LDFLAGS="-s -w -X main.version=${VERSION}"

          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o panos-mcp-go-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o panos-mcp-go-linux-arm64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o panos-mcp-go-darwin-amd64 .
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o panos-mcp-go-darwin-arm64 .
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o panos-mcp-go-windows-amd64.exe .

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3
        with:
          generate_release_notes: true
          # Glob the built binaries rather than relisting them, so a new target
          # in the build step above ships without a second edit here. A fresh
          # checkout has no other panos-mcp-go-* files.
          files: panos-mcp-go-*
