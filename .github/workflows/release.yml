name: Release

on:
  push:
    tags:
      - "v*"
  # Manual runs must be dispatched on a tag ref; GoReleaser refuses to release an
  # untagged commit.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # fetch-depth: 0 so the tag and full history are present for the changelog.
      # persist-credentials: false keeps GITHUB_TOKEN out of .git/config: GoReleaser
      # reads the token from the job environment for the GitHub release, and the tap
      # push uses the deploy key over SSH, so the checkout credential is never used.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Hardcoded to match ci.yml and the go.mod version that
      # repo_hygiene_test.go's TestGoVersionCoordinated keeps in lockstep.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"

      # Gate the release on the race suite, the same bar CI enforces.
      - name: Test before release
        run: go test ./... -race

      # SHA-pinned: this job holds contents: write, so a moving tag on a third-party
      # action is a supply-chain risk. Bump the pin by hand (Dependabot also updates
      # it). GoReleaser config lives in .goreleaser.yaml.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
