version: '3'

vars:
  BINARY_NAME: panos-mcp-go

tasks:

  default:
    desc: Run all local checks (fmt, tidy, vet, lint, test)
    cmds:
      - task: check

  # check must not modify the working tree: it has to be able to answer "is this
  # branch clean" and to run in CI. The mutating go:fmt and go:tidy stay
  # available for local use.
  check:
    desc: Run all local checks (fmt, tidy, vet, lint, test) without modifying files
    cmds:
      - task: go:fmt:check
      - task: go:tidy:check
      - task: go:vet
      - task: go:lint
      - task: go:lint:selftest
      - task: go:test

  ci:
    desc: Full CI pipeline, check then build
    cmds:
      - task: check
      - task: go:build

  go:build:
    desc: Build the binary
    aliases: [build]
    vars:
      # Stamped into main.version via -ldflags. Falls back to "dev" outside a git
      # checkout (a source tarball, for example). CI runs task ci -> go:build, so
      # CI and release binaries carry the real git describe output (issue #6).
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo dev
    sources:
      - '**/*.go'
      - go.mod
      - go.sum
    generates:
      - '{{.BINARY_NAME}}'
    cmds:
      - go build -ldflags "-X main.version={{.VERSION}}" -o {{.BINARY_NAME}} .

  go:run:
    desc: Run the server in stdio mode (requires env vars)
    cmds:
      - go run .

  go:test:
    desc: Run tests with race detector
    cmds:
      - go test -v -race ./...

  go:vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  # gocritic reads rules/*.go through linters.settings.gocritic.settings.ruleguard
  # in .golangci.yaml, not through the Go build, so the //go:build ruleguard tag on
  # those files does not keep them out and --build-tags=ruleguard does not affect
  # whether they load. Verified with golangci-lint 2.12.2 by "task go:lint:selftest".
  go:lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run

  # Proves the ruleguard rules are actually loaded, by planting a violation one of
  # them detects and requiring the rule's OWN message back. A silently empty rule
  # set is otherwise invisible: golangci-lint still reports success on the tree.
  #
  # Two things this check gets wrong if written casually. Grepping for the word
  # "ruleguard" matches golangci-lint's own error text ("gocritic: ruleguard init
  # error: no file matching ..."), so a broken rules path reports success; match
  # the rule's message instead, and keep stderr out of the comparison. And writing
  # the probe into the repo leaves a stray Go file behind when a developer hits
  # Ctrl-C, because Task's shell does not run an EXIT trap on SIGINT; build it in
  # a temp directory instead.
  go:lint:selftest:
    desc: Verify the ruleguard rules in rules/ are loaded and firing
    cmds:
      - |
        set -eu
        probe=$(mktemp -d)
        trap 'rm -rf "$probe"' EXIT
        cat > "$probe/probe.go" <<'EOF'
        package main

        import (
        	"errors"
        	"io/fs"
        )

        func ruleguardSelftest(err error) string {
        	var pathErr *fs.PathError
        	if errors.As(err, &pathErr) {
        		return pathErr.Path
        	}
        	return ""
        }
        EOF
        cp go.mod go.sum .golangci.yaml "$probe/"
        cp -R rules "$probe/"
        out=$(cd "$probe" && golangci-lint run probe.go 2>/dev/null) || true
        if printf '%s' "$out" | grep -q 'errors.AsType'; then
          echo "ruleguard rules are loaded and firing"
        else
          echo "FAIL: ruleguard rules did not fire. Check that go-ruleguard/dsl is in" >&2
          echo "go.mod and that gocritic settings.ruleguard.rules matches rules/*.go." >&2
          exit 1
        fi

  # Formatting goes through golangci-lint, not a standalone goimports, because
  # the two disagree: golangci-lint's formatter applies gofmt's doc comment
  # rules (which relocate //nolint and other directives) and a standalone
  # goimports does not. Using both means a tree that passes locally and fails in
  # CI, since CI formats through the lint job.
  go:fmt:
    desc: Format code (modifies files)
    cmds:
      - golangci-lint fmt

  go:fmt:check:
    desc: Fail if any file is not formatted
    cmds:
      - golangci-lint fmt --diff

  go:tidy:
    desc: Tidy go modules (modifies go.mod and go.sum)
    cmds:
      - go mod tidy

  # go mod tidy -diff writes nothing and exits non-zero when tidy would change
  # go.mod or go.sum, catching an un-tidied dependency change (a stray require,
  # a dropped one, a stale go.sum entry) before it reaches CI.
  go:tidy:check:
    desc: Fail if go.mod or go.sum is not tidy
    cmds:
      - go mod tidy -diff

  go:clean:
    desc: Remove build artifacts
    cmds:
      - rm -f {{.BINARY_NAME}}

  image:build:
    desc: Build the container image
    vars:
      # Same version source as go:build, passed to the Dockerfile as a build arg
      # because .dockerignore excludes .git from the build context.
      VERSION:
        sh: git describe --tags --always --dirty 2>/dev/null || echo docker
    cmds:
      - docker build --build-arg VERSION={{.VERSION}} -t panos-mcp-go:{{.VERSION}} .
